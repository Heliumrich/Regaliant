[package]
name = "dsconfig"
# Fixed, as the runtime's (crates/runtime/Cargo.toml says why): cargo mixes this crate's version
# into the runtime's symbol hashes. Never change it with a release.
version = "0.1.7"
description = "Shared by Regaliant's runtime and launcher: where its files are kept, the game folder's checks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
# The game as a .zar archive: its 64 KiB blocks are zstd frames (`zar`).
zstd = { version = "0.13", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
] }
