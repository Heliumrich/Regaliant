[package]
name = "dsport"
version = "0.1.0"
description = "Native Windows x86-64 runtime for Demon's Souls (PS5, PPSA01341): PS5 HLE + native CPU execution"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dsport"
path = "src/main.rs"

[dependencies]
sce-elf = { path = "../sce-elf" }
rdna = { path = "../rdna" }
parking_lot = "0.12"
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
miniz_oxide = "0.8"
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "fast_fmt", "code_asm"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Environment",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
cc = "1"
