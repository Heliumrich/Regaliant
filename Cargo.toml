[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[profile.dev]
# Guest code runs natively; host-side HLE should still be reasonably fast in debug.
opt-level = 1
panic = "abort"

[profile.release]
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
