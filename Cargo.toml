[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[profile.dev]
# Guest code runs natively; host-side HLE should still be reasonably fast in debug.
opt-level = 1
panic = "abort"

[profile.release]
debug = "line-tables-only"
panic = "abort"

# Whole-program optimization for measurement and release builds (slower to
# build; `release` stays the daily build): `scripts/cargo.ps1 build --profile
# release-lto`, run with DSPORT_PROFILE=release-lto (scripts/gpu-run.ps1).
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

# Profile-guided builds on top of release-lto (scripts/pgo.ps1): the
# instrumented build that gathers counters, and the build that uses them.
[profile.release-pgo-gen]
inherits = "release-lto"

[profile.release-pgo]
inherits = "release-lto"

# The player package (scripts/package.ps1): release-lto without debug information, stripped,
# built with the profile release-pgo uses (dsport) and the release flags (a static C runtime,
# this machine's paths remapped).
[profile.dist]
inherits = "release-lto"
debug = false
strip = true
incremental = false

[profile.dev.package."*"]
opt-level = 2
